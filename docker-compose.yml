services:
  db:
    image: pgvector/pgvector:pg16
    container_name: matchiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: matchiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matchiq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgrespassword@db:5432/matchiq}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
      RERANKER_MODEL_NAME: cross-encoder/ms-marco-MiniLM-L-6-v2
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    command: >
      sh -c "python scripts/migrate.py &&
             python scripts/init_and_seed.py --demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:

